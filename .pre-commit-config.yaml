default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit, pre-push]
        # Patch files intentionally contain whitespace-sensitive source context.
        exclude: ^tests/compatibility/data/.*\.patch$

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        stages: [pre-commit, pre-push]

      - id: check-docstrings
        name: check docstrings
        entry: uv run python tools/check_docstrings.py --quiet --ignore-imperative-warnings
        language: system
        files: ^src/.*\.py$
        stages: [pre-push]

      - id: pyright
        name: pyright
        entry: uv run pyright src
        language: system
        pass_filenames: false
        stages: [pre-push]
